[project]
name = "nexus-rpc"
# The nexus-rpc name on PyPI was originally held by an unrelated project that reached
# version 1.0.1 and was abandoned in 2018. The Python Nexus SDK inherited the name in
# 2025 and began at version 1.1.0 because PyPI retains a continuous version history.
version = "1.5.0"
description = "Nexus Python SDK"
readme = "README.md"
authors = [{ name = "Temporal Technologies", email = "sdk@temporal.io" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typing-extensions>=4.12.2"]

[dependency-groups]
dev = [
    "basedpyright>=1.30.1",
    "mypy>=1.15.0",
    "poethepoet>=0.35.0",
    "pydoctor>=25.4.0",
    "pyright>=1.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-pretty>=1.3.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusrpc"]

[tool.poe.tasks]
lint = [
    { cmd = "uv run basedpyright" },
    { cmd = "uv run pyright" },
    { cmd = "uv run mypy --check-untyped-defs src" },
    { cmd = "uv run ruff check --select I" },
    { cmd = "uv run ruff format --check" },
]
format = [
    { cmd = "uv run ruff check --select I --fix" },
    { cmd = "uv run ruff format" },
]
docs = [{ cmd = "uv run pydoctor src/nexusrpc" }]

[tool.pyright]
# https://microsoft.github.io/pyright/#/configuration?id=type-check-rule-overrides
# https://docs.basedpyright.com/v1.30.0/configuration/config-files/#diagnostic-settings-defaults
reportAny = "none"
reportDeprecated = "none"
reportExplicitAny = "none"
reportIgnoreCommentWithoutRule = "none"
reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
reportUnannotatedClassAttribute = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryTypeIgnoreComment = "none"
enableTypeIgnoreComments = true
include = ["src", "tests"]

[tool.mypy]
disable_error_code = ["empty-body"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pydoctor]
docformat = "google"
