name: Smoke test published package
description: Install an exact nexus-rpc release and exercise its public API.
inputs:
  version:
    description: Exact package version
    required: true
  index-url:
    description: Package index URL
    required: true
  dependency-index-url:
    description: Separate dependency index for TestPyPI
    default: ""
  python-version:
    description: Python version for the clean installation
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install and smoke test
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INDEX_URL: ${{ inputs.index-url }}
        DEPENDENCY_INDEX_URL: ${{ inputs.dependency-index-url }}
      run: |
        set -euo pipefail
        test_dir="$(mktemp -d)"
        python -m venv "$test_dir/venv"
        args=(--version "$VERSION" --index-url "$INDEX_URL")
        if [[ -n "$DEPENDENCY_INDEX_URL" ]]; then
          args+=(--dependency-index-url "$DEPENDENCY_INDEX_URL")
        fi
        "$test_dir/venv/bin/python" -I scripts/release_install.py "${args[@]}"
        "$test_dir/venv/bin/python" -I scripts/release_smoke.py --version "$VERSION"
